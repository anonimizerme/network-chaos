name: Release Chrome extension

on:
  workflow_dispatch:
  push:
    tags:
      - 'v[0-9]*'

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || github.event.created
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run zip
      - name: Publish extension ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          archive=".output/network-chaos-$version-chrome.zip"
          unzip -t "$archive"

          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            gh auth setup-git
            git push origin "HEAD:refs/tags/$tag"
          elif [[ "$GITHUB_REF_NAME" != "$tag" ]]; then
            echo "::error::Expected tag $tag for package.json version $version, got $GITHUB_REF_NAME"
            exit 1
          fi

          gh release create "$tag" "$archive" --verify-tag --generate-notes
